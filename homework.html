  <style>
    .world-panel {
      width: 100%;
      margin-top: 30px;
      padding: 8px 12px;
      background: #000;
      border: 1px solid #555;
      box-shadow: none;
      border-radius: 0;
    }
    .world-title {
      margin: 0 0 3px;
      color: #ffffff;
      font-size: 15px;
      font-weight: normal;
      letter-spacing: 0px;
    }
    .world-date {
      display: block;
      margin: 0 0 30px;
      color: #ff0000;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    #openlayers-map {
      position: relative;
      width: 100%;
      height: 480px;
      background: #168bd2;
      border: 1px solid #555;
    }
    header {
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .logo {
      margin-bottom: 9px;
    }
    .ad-banner {
      margin-top: -6px;
      transform: none;
    }
    .city-table-wrapper {
      width: 100%;
      margin-top: 30px;
    }
    .table-title {
      margin: 0 0 30px;
      color: #ffffff;
      font-size: 15px;
      font-weight: normal;
      letter-spacing: 1px;
    }
    .city-table {
      width: 100%;
      border-collapse: collapse;
      color: #eee;
      font-size: 15px;
      text-align: left;
    }
    .city-table th {
      color: #ffffff;
      font-weight: normal;
      letter-spacing: 1px;
      border-bottom: 1px solid #555;
    }
    .city-table th,
    .city-table td {
      border-bottom: 1px solid #555;
    }
    .city-table tbody en {
      transition: background-color 0.1s ease;
    }
    .city-table tbody en:hover {
      background-color: #555;
    }
    .city-table td:last-child,
    .city-table th:last-child {
      text-align: right;
    }
    .city-table .city-time {
      color: #ff3333;
      font-variant-numeric: tabular-nums;
    }
  </style>
  <main>
    <div class="ad-banner">

    </section>
